name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: accel-sim/accel-sim-framework


jobs:
  push_to_registry:
    if: github.repository == 'accel-sim/Dockerfile'
    name: Push Docker image to ghcr.io
    # tgrogers-raid has no docker daemon; the docker CLI here drives tgrogers-pc02's daemon over ssh.
    runs-on: tgrogers-raid
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_HOST: ssh://tgrogers-pc02
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install the docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/docker" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Set up buildx on the remote daemon
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver: docker

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
